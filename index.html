<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تكلفة المجمدات</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="تكلفة المجمدات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
 <header class="top">
  <div class="brand"><h1>تكلفة المجمدات</h1><span class="sub">تكلفة الطن الصافي ظهر الحاوية</span></div>
  <span id="net" class="net"></span>
 </header>
 <nav id="vars" class="vars" aria-label="الصنف"></nav>
 <div id="notice" class="notice" hidden></div>
 <section class="card sum" id="sum"></section>
 <div class="actions">
  <button class="btn pri" id="bReport">عرض التقرير</button>
  <button class="btn" id="bShare">مشاركة PDF</button>
  <button class="btn" id="bPrint">طباعة</button>
 </div>
 <section class="card">
  <h2>بيانات الحساب</h2>
  <div class="grid" id="inputs"></div>
 </section>
 <section class="card">
  <h2>مستلزمات التصنيع <small>ج / طن صافي</small></h2>
  <div id="supplies"></div>
  <button class="btn ghost wide" id="bAddSup">+ إضافة بند</button>
 </section>
 <section class="card" id="breakdown"></section>
 <section class="card tools">
  <button class="btn ghost" id="bRename">تعديل اسم الصنف</button>
  <button class="btn ghost" id="bReset">رجوع للأرقام الافتراضية</button>
  <button class="btn ghost danger" id="bDel" hidden>حذف الصنف</button>
 </section>
 <footer class="foot">يشتغل من غير نت بعد أول فتح · البيانات محفوظة على الجهاز ده بس <span id="ver"></span></footer>
</div>
<div id="rep" class="rep" hidden>
 <div class="repbar">
  <button class="btn" id="rClose">رجوع</button>
  <button class="btn pri" id="rShare">مشاركة PDF</button>
  <button class="btn" id="rPrint">طباعة</button>
 </div>
 <div id="pages" class="pages"></div>
</div>
<div id="busy" class="busy" hidden><div>بيجهز الـ PDF…</div></div>
<script src="core.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(r){r.update&&r.update();setInterval(function(){r.update()},3600000)});var had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!window.__rl){window.__rl=1;location.reload()}})})}
</script>
</body>
</html>
